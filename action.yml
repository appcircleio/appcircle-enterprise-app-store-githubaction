name: 'Appcircle Enterprise App Store'
author: 'appcircleio'
description:
  'Appcircle Enterprise App Store is your own mobile app store for providing
  access to in-house apps with a customizable mobile storefront.'

branding:
  icon: 'activity'
  color: 'orange'

inputs:
  personalAPIToken:
    description:
      'Provide Appcircle Personal API Token to authenticate Appcircle services.'
    required: true
  authEndpoint:
    description:
      'Optional: Authentication endpoint URL for self-hosted Appcircle
      installations. Defaults to the Appcircle cloud.'
    required: false
    default: 'https://auth.appcircle.io'
  apiEndpoint:
    description:
      'Optional: API endpoint URL for self-hosted Appcircle installations.
      Defaults to the Appcircle cloud.'
    required: false
    default: 'https://api.appcircle.io'
  appPath:
    description:
      'Specify the path to your application file. For iOS, this can be a .ipa
      file path. For Android, specify the .apk or .aab file
      path'
    required: true
  summary:
    description: 'Summary Notes For Publishment'
    required: true
  releaseNotes:
    description: 'Release Notes For Publishment'
    required: true
  publishType:
    description: 'Publish Type' # 0: None, 1: Beta, 2: Live
    required: false
    default: '0'
runs:
  using: 'node24'
  main: 'dist/index.js'
